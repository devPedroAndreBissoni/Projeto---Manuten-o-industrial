<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <!-- linha de divisão -->
      <path d="M8 54 H92" stroke="#000" stroke-width="4"/>
      <!-- espaço ao redor do fecho -->
      <rect x="40" y="44" width="20" height="21" rx="5" fill="#000"/>
