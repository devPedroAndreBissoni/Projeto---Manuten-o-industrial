  </defs>
  <!-- alça -->
  <path d="M36 32 V24 a6 6 0 0 1 6 -6 h16 a6 6 0 0 1 6 6 V32" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- corpo -->
